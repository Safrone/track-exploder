# Android 15 devices can boot with 16 KB memory pages, and Play requires 64-bit
# native libraries to load there. NDK r27's clang still links ELF segments at
# 4 KB unless asked, and cargo drives that linker itself, so the alignment has
# to be requested here rather than from Gradle.
#
# Release builds set RUSTFLAGS, which REPLACES everything below rather than
# adding to it. .github/scripts/android-release-rustflags.sh repeats this flag
# for that reason; a change here needs the same change there.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
