# Builds the Android App Bundle for a Google Play submission. Separate from the
# sideload APK in `release.yml`, which is debug-signed and which Play rejects.
# An AAB isn't installable, so it's published as a workflow artifact rather than
# a release asset. See docs/android-play-release.md.
name: Android AAB (Google Play)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode override (blank = derive from the app version). Only needed to re-upload after a Play rejection."
        required: false
        type: string

concurrency:
  group: android-aab
  cancel-in-progress: false

jobs:
  aab:
    name: Android AAB (arm64 + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Play splits per ABI at install time, so x86_64 costs users nothing and
      # covers Chromebooks and emulators.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # Cold runs pull the whole AGP/Kotlin dependency tree.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      # The NDK is a ~1 GB download; cache it so only the first run pays for it.
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018
      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Initialize Android project & apply app icons
        run: |
          npm run tauri android init
          # `android init` scaffolds Tauri's default launcher icon; overwrite the
          # generated res with our committed app icons so the bundle uses our logo.
          dest=src-tauri/gen/android/app/src/main/res
          cp -rf src-tauri/icons/android/mipmap-* "$dest/"
          cp -f src-tauri/icons/android/values/ic_launcher_background.xml "$dest/values/"
      - name: Configure upload signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          # Only for a legacy JKS store; PKCS12 has no separate key password.
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -eu
          for v in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::ANDROID_UPLOAD_$v is not set; see docs/android-play-release.md" >&2
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "storeFile=$ks"
          } > src-tauri/gen/android/keystore.properties
          python3 .github/scripts/patch-android-signing.py --debug-symbols
      # No --split-per-abi: Play wants one bundle carrying every ABI and does the
      # per-device splitting itself.
      - name: Build AAB (release, with MP3)
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          # The workspace release profile strips, leaving AGP nothing to collect
          # for debugSymbolLevel. AGP strips the copy it packages either way.
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          set -eu
          args=(--aab --target aarch64 x86_64 --features mp3)
          if [ -n "${VERSION_CODE:-}" ]; then
            args+=(-c "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}")
          fi
          npm run tauri android build -- "${args[@]}"
      - name: Verify and name the bundle
        id: bundle
        run: |
          set -eu
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*release*.aab' -print -quit)
          if [ -z "$aab" ]; then
            echo "::error::No release AAB was produced" >&2
            find src-tauri/gen/android -name '*.aab' || true
            exit 1
          fi
          version=$(jq -r .version src-tauri/tauri.conf.json)
          code=$(grep '^tauri.android.versionCode=' src-tauri/gen/android/app/tauri.properties | cut -d= -f2)
          dest="$RUNNER_TEMP/Track-Exploder_${version}_${code}.aab"
          cp "$aab" "$dest"
          ls -lh "$dest"
          # Set before the checks below so a failed check still uploads the
          # bundle to inspect.
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          # Whether AGP ran its native tasks at all, and on what.
          echo "--- native intermediates ---"
          ls -d src-tauri/gen/android/app/build/intermediates/*native* 2>/dev/null || echo "(none)"
          find src-tauri/gen/android/app/build/intermediates -path '*native*' -name '*.so*' \
            -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -10 || true
          echo "--- release build type as patched ---"
          sed -n '/getByName("release")/,/^        }/p' src-tauri/gen/android/app/build.gradle.kts
          # An AAB is jar-signed, so keytool can read the signer back. The debug
          # cert means a swapped secret; catch it before the upload.
          certs=$(keytool -printcert -jarfile "$aab")
          echo "$certs"
          if [ -z "$certs" ]; then
            echo "::error::The AAB is unsigned" >&2
            exit 1
          fi
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The AAB is signed with the Android debug key; Play will reject it" >&2
            exit 1
          fi
          # Play reads symbols out of the bundle; a per-artifact upload in Play
          # Console is the fallback if this ever stops working.
          syms=$(unzip -l "$aab" | grep -c 'BUNDLE-METADATA/com.android.tools.build.debugsymbols' || true)
          if [ "$syms" -eq 0 ]; then
            echo "::error::No native debug symbols in the bundle — AGP's extract task did not run" >&2
            exit 1
          fi
          echo "native debug symbols present ($syms entries)"
          # When AGP can't find the NDK it neither extracts symbols nor strips,
          # and ships cargo's unstripped library at ~2x the size.
          unzip -q -o "$aab" 'base/lib/*/*.so' -d "$RUNNER_TEMP/aabcheck"
          for so in "$RUNNER_TEMP"/aabcheck/base/lib/*/libtrack_exploder_lib.so; do
            desc=$(file -b "$so")
            echo "$(basename "$(dirname "$so")"): $(stat -c%s "$so") bytes — $desc"
            case "$desc" in
              *"not stripped"*|*"with debug_info"*)
                echo "::error::$so is unstripped; AGP did not strip the packaged library" >&2
                exit 1
                ;;
            esac
          done
          # A library whose LOAD segments sit on 4 KB boundaries can't be loaded
          # on an Android 15 device running 16 KB pages, and Play reports the
          # bundle as not supporting them. Cargo links ours; see .cargo/config.toml.
          echo "--- 16 KB page alignment ---"
          for so in "$RUNNER_TEMP"/aabcheck/base/lib/*/*.so; do
            for align in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ "$((align))" -lt 16384 ]; then
                echo "::error::$so has a LOAD segment aligned to $align; 16 KB page devices can't load it" >&2
                exit 1
              fi
            done
            echo "$(basename "$(dirname "$so")")/$(basename "$so"): 16 KB aligned"
          done
      # archive: false uploads the .aab as-is rather than wrapping it in a zip,
      # so the download can go straight to Play Console.
      - name: Upload the bundle as a workflow artifact
        if: always() && steps.bundle.outputs.path != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.bundle.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90
