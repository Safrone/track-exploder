name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & release (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
            args: "--target aarch64-apple-darwin --features mp3"
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin --features mp3"
          - platform: ubuntu-latest
            label: Linux
            # No AppImage: it bundles WebKitGTK/GL libs that white-screen on
            # NVIDIA. The deb/rpm use system WebKitGTK and work.
            args: "--features mp3 --bundles deb,rpm"
          - platform: windows-latest
            label: Windows
            args: "--features mp3"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev
      - run: npm ci
      # Builds installers and attaches them to a draft GitHub release for the tag.
      # MP3 export is enabled (--features mp3 → pure-Rust shine-rs, LGPL).
      # macOS/Windows installers are unsigned (users may see OS prompts, documented
      # in README); the Linux RPM is GPG-signed in the step below.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Track Exploder ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            Extract and remix barbershop part-left learning tracks — isolate each voice, build any mix, change tempo without changing pitch, and export. MP3 export is enabled in these builds.

            ## Which download do I need?

            | Your system | File to download |
            | --- | --- |
            | **Windows** | the `_x64-setup.exe` (or `.msi`) — unsigned; SmartScreen → **More info → Run anyway** |
            | **macOS — Apple Silicon** (M1–M4) | the `_aarch64.dmg` — unsigned; **right-click → Open** the first time |
            | **macOS — Intel** | the `_x64.dmg` — unsigned; **right-click → Open** the first time |
            | **Linux — openSUSE / Fedora / RHEL** | the `.rpm` — GPG-signed (import `track-exploder-signing-key.asc` first) |
            | **Linux — Debian / Ubuntu** | the `_amd64.deb` |
            | **Android** (arm64) | the `_android-arm64.apk` — sideload it; updates install over the previous version |

            The `*.app.tar.gz` files are auto-update artifacts — ignore them for a normal install.

            ## Verify the RPM (openSUSE / Fedora)

            ```bash
            sudo rpm --import track-exploder-signing-key.asc
            sudo zypper install ./Track.Exploder-*.rpm    # or: sudo dnf install on Fedora
            ```

            Signing key fingerprint: `3A1F 4A9A 5EF1 A7F1`. macOS/Windows builds are unsigned (no code-signing certs yet); the steps above clear the OS prompts.

      # GPG-sign the RPM and replace the unsigned one on the release, plus attach
      # the public key so users can `rpm --import` it and verify.
      - name: Sign the Linux RPM
        if: matrix.platform == 'ubuntu-latest'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: 3A1F4A9A5EF1A7F1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > /tmp/te-gpg-pass
          cat > "$HOME/.rpmmacros" <<EOF
          %_signature gpg
          %_gpg_name $GPG_KEY_ID
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase-file /tmp/te-gpg-pass --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          # Cargo workspace is rooted at the repo, so bundles land in ./target.
          src=$(find target src-tauri/target -name '*.rpm' -print -quit 2>/dev/null || true)
          if [ -z "$src" ]; then echo "No RPM found" >&2; find . -name '*.rpm' 2>/dev/null; exit 1; fi
          # The product name has a space ("Track Exploder"), which rpm's signer
          # can't handle in a path. Sign a space-free copy named exactly like the
          # asset tauri-action uploaded (spaces -> dots) so --clobber replaces it.
          asset="$(basename "$src" | tr ' ' '.')"
          cp "$src" "$asset"
          echo "Signing $asset"
          # rpm --addsign fails (non-zero) if gpg signing errors, so this is the
          # real guard that a signature was written.
          rpm --addsign "$asset"
          gpg --export --armor "$GPG_KEY_ID" > track-exploder-signing-key.asc
          sudo rpm --import track-exploder-signing-key.asc
          # Informational only: the Ubuntu runner's rpm can't verify EdDSA
          # signatures (openSUSE/Fedora, which use the libgcrypt backend, can),
          # so a "NOT OK" here is a runner limitation, not a bad signature.
          rpm --checksig "$asset" || echo "note: runner rpm can't self-verify EdDSA; signature was still added"
          shred -u /tmp/te-gpg-pass 2>/dev/null || rm -f /tmp/te-gpg-pass
          gh release upload "${GITHUB_REF_NAME}" "$asset" track-exploder-signing-key.asc --clobber

  android:
    name: Android APK (arm64)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # Not the checkout directory: Tauri bakes $CARGO_MANIFEST_DIR into the
        # binary, so this APK is only reproducible if it is compiled from the
        # same absolute path F-Droid's buildserver compiles it from. See the
        # copy step below and docs/fdroid.md.
        working-directory: /home/vagrant/build/com.safrone.trackexploder
    steps:
      - uses: actions/checkout@v5
      - name: Stage the checkout at F-Droid's build path
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          dest=/home/vagrant/build/com.safrone.trackexploder
          sudo mkdir -p "$(dirname "$dest")"
          sudo cp -a "$GITHUB_WORKSPACE" "$dest"
          sudo chown -R "$(id -un):$(id -gn)" /home/vagrant
      # Every toolchain below is pinned to what F-Droid's buildserver provides.
      # This APK has to come out byte-identical to the one F-Droid builds from
      # source, or it loses reproducible-build status. See docs/fdroid.md.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # 21, not 17: the buildserver installs default-jdk-headless and switches to
      # the highest JDK present, and Debian trixie has no openjdk-17 to pin it to.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The toolchain itself comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android
      # No rust-cache here: the build runs outside the workspace it keys on, and
      # a release pays the cold-build cost once.
      # signalsmith-stretch runs bindgen in its build script, against the host
      # libclang. Debian trixie ships LLVM 19; a different version can emit
      # different bindings from the same headers.
      - name: Pin libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-19-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"
      # Gradle downloads the Android Gradle Plugin, Kotlin toolchain and its whole
      # dependency tree on a cold run; caching ~/.gradle keeps that off the clock.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      # The NDK is a ~1 GB download; cache it so only the first release pays for it.
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018
      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Initialize Android project & apply app icons
        run: |
          npm run tauri android init
          # `android init` scaffolds Tauri's default launcher icon; overwrite the
          # generated res with our committed app icons so the APK uses our logo.
          dest=src-tauri/gen/android/app/src/main/res
          cp -rf src-tauri/icons/android/mipmap-* "$dest/"
          cp -f src-tauri/icons/android/values/ic_launcher_background.xml "$dest/values/"
      # The generated release build type has no signing config; inject one using
      # our keystore. Same key across releases, so updates install in place.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_STORE_PASSWORD }}
        run: |
          set -eu
          for v in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::ANDROID_SIDELOAD_$v is not set; see docs/fdroid.md" >&2
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/sideload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # PKCS12 has one password for both the store and the key; the injected
          # Gradle config falls back to `password` for each.
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$STORE_PASSWORD"
            echo "storeFile=$ks"
          } > src-tauri/gen/android/keystore.properties
          python3 .github/scripts/patch-android-signing.py
      - name: Build Android APK (arm64, release, with MP3)
        run: |
          set -eu
          RUSTFLAGS=$(.github/scripts/android-release-rustflags.sh)
          export RUSTFLAGS
          npm run tauri android build -- --apk --target aarch64 --features mp3
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' ! -name '*unsigned*' -print -quit)
          if [ -z "$apk" ]; then
            echo "No signed release APK found" >&2
            find src-tauri/gen/android -name '*.apk' || true
            exit 1
          fi
          # Verify it's actually signed, so a mis-applied config fails the release
          # rather than shipping an un-installable APK.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          # A debug cert means the wrong secret: this key is the app's permanent
          # identity for sideload and F-Droid users, and can never be rotated
          # without everyone uninstalling.
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with an Android debug key, not the sideload release key" >&2
            exit 1
          fi
          # F-Droid rejects an APK with an unrecognised signing block or, less
          # fatally but visibly, advertises permissions the app never uses. Both
          # have already cost a published release; check before uploading.
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          python3 .github/scripts/check-android-apk.py "$apk" "$aapt2"
          dest="Track-Exploder_${GITHUB_REF_NAME}_android-arm64.apk"
          cp "$apk" "$dest"
          ls -lh "$dest"
          gh release upload "$GITHUB_REF_NAME" "$dest" --clobber
